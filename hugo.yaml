baseURL: 'https://mingyuanzhang.com/'
locale: en-us
title: "Mingyuan Zhang"
theme: PaperMod

enableRobotsTXT: true
enableEmoji: true
buildDrafts: false
buildFuture: false

pagination:
  pagerSize: 10

minify:
  disableXML: true

# Sections listed on the homepage below the intro
params:
  env: production # enables analytics/OpenGraph/Twitter-cards
  title: "Mingyuan Zhang"
  description: "Personal website of Mingyuan (Ming) Zhang — building reliable AI agent systems; Ph.D. in Computer and Information Science, University of Pennsylvania."
  keywords: [Machine Learning, Large Language Models, AI Agents, Reinforcement Learning]
  author: "Mingyuan Zhang"
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowToc: true
  TocOpen: false
  ShowRssButtonInSectionTermList: true
  disableScrollToTop: false
  hidemeta: false
  comments: false

  # Render LaTeX with KaTeX (see layouts/partials/extend_head.html)
  math: true

  # Only these sections are listed on the homepage
  mainSections:
    - articles

  assets:
    favicon: "/images/favicon.jpg"
    apple_touch_icon: "/images/favicon.jpg"
    disableHLJS: true

  label:
    text: "Mingyuan Zhang"

  socialIcons:
    - name: linkedin
      title: LinkedIn
      url: "https://www.linkedin.com/in/mingyuanzhang"
    - name: github
      title: GitHub
      url: "https://github.com/zmydev"
    - name: googlescholar
      title: Google Scholar
      url: "https://scholar.google.com/citations?hl=en&user=0mAq5yUAAAAJ&view_op=list_works&sortby=pubdate"

menu:
  main:
    - identifier: publications
      name: Publications
      url: /publications/
      weight: 10
    - identifier: articles
      name: Articles
      url: /articles/
      weight: 20
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 30

markup:
  goldmark:
    renderer:
      unsafe: true # allow the small amount of raw HTML used on the homepage
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai

